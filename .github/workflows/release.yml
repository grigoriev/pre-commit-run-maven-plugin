name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"

      - name: Build and test
        run: mvn -B clean verify

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25.0.4+101.0.LTS"
          distribution: "temurin"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # The notes come from the CHANGELOG.md section that bump-version.yml cut.
      # A tag without that section fails here, before anything is published.
      - name: Read the release notes from CHANGELOG.md
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish to Maven Central
        run: mvn -B deploy -Prelease -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # The gpg plugin copies pom.xml to target/ before it signs it, so
      # target/*.pom holds the same bytes as the deployed pom.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/*.jar
            target/*.pom

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # The signed provenance bundle travels with the files.
          cp "$BUNDLE" "target/pre-commit-run-maven-plugin-${GITHUB_REF_NAME#v}.intoto.jsonl"
          # A rerun replaces the files of the existing release.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" target/*.jar target/*.pom target/*.intoto.jsonl \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" target/*.jar target/*.pom target/*.intoto.jsonl \
              --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  bump-to-snapshot:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the Commit and push step pushes with PAT_TOKEN
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25.0.4+101.0.LTS"
          distribution: "temurin"

      - name: Calculate next SNAPSHOT version
        id: snapshot
        run: |
          # Extract version from tag (e.g., v0.1.1 -> 0.1.1)
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
          NEXT_VERSION="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next development version: $NEXT_VERSION"

      - name: Update to SNAPSHOT version
        env:
          NEXT_VERSION: ${{ steps.snapshot.outputs.version }}
        run: |
          mvn versions:set "-DnewVersion=${NEXT_VERSION}" -DgenerateBackupPoms=false

      - name: Commit and push
        env:
          NEXT_VERSION: ${{ steps.snapshot.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore: bump to ${NEXT_VERSION} for development"
          git push origin main

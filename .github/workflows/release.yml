name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The release profile waits up to 60 minutes for Maven Central to publish
    # (waitMaxTime 3600), then the attestation and the release follow.
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Maven cache: a cache written by another run could reach the
      # published artifact (zizmor cache-poisoning).
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25.0.4+101.0.LTS"
          distribution: "temurin"
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      # The integration tests run pre-commit. Without it they skip themselves.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pre-commit
        run: |
          pip install --only-binary=:all: --require-hashes -r .github/requirements/pre-commit.txt

      # The notes come from the CHANGELOG.md section that bump-version.yml cut.
      # A tag without that section fails here, before anything is published.
      - name: Read the release notes from CHANGELOG.md
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"

      # Releases are immutable: the release gets all its files in the one create
      # call below. A tag that has a release already stops here, before the deploy.
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only "not found" (HTTP 404) lets the release go on. Any other lookup
          # error stops it too, so an API failure never reads as "no release".
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1); then
            echo "::error::Release $GITHUB_REF_NAME exists. Releases are immutable: release a new version."
            exit 1
          fi
          case "$out" in
            *"(HTTP 404)"*) echo "No release $GITHUB_REF_NAME yet." ;;
            *) echo "::error::Cannot look up release $GITHUB_REF_NAME: $out"; exit 1 ;;
          esac

      # deploy walks the whole lifecycle, so the unit and integration tests run
      # here, on the tree that is published. A separate test job would build
      # the project twice and publish a tree other than the tested one.
      - name: Test and publish to Maven Central
        run: mvn -B clean deploy -Prelease
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Signs the provenance of the files deployed above, not of a rebuild.
      # The gpg plugin copies pom.xml to target/ before it signs it, so
      # target/*.pom holds the same bytes as the deployed pom.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/*.jar
            target/*.pom

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # The signed provenance bundle travels with the files.
          cp "$BUNDLE" "target/pre-commit-run-maven-plugin-${GITHUB_REF_NAME#v}.intoto.jsonl"
          gh release create "$GITHUB_REF_NAME" target/*.jar target/*.pom target/*.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md"

  bump-to-snapshot:
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # persist-credentials: false, so no token lands in .git/config while Maven
      # runs its plugins. PAT_TOKEN reaches only the step that pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25.0.4+101.0.LTS"
          distribution: "temurin"

      - name: Calculate next SNAPSHOT version
        id: snapshot
        run: |
          # Extract version from tag (e.g., v0.1.1 -> 0.1.1)
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
          NEXT_VERSION="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next development version: $NEXT_VERSION"

      - name: Update to SNAPSHOT version
        env:
          NEXT_VERSION: ${{ steps.snapshot.outputs.version }}
        run: |
          mvn versions:set "-DnewVersion=${NEXT_VERSION}" -DgenerateBackupPoms=false

      # PAT_TOKEN, not GITHUB_TOKEN: the ruleset lets only the admin push to main.
      - name: Commit and push
        env:
          NEXT_VERSION: ${{ steps.snapshot.outputs.version }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore: bump to ${NEXT_VERSION} for development"
          # The token reaches git through GIT_ASKPASS, so the remote URL holds no
          # credential. A URL with the token would show in the process list and in
          # the output of a failed push. The helper reads the token from the env.
          # shellcheck disable=SC2016  # $PAT_TOKEN is read when the helper runs
          printf '#!/bin/sh\nexec echo "$PAT_TOKEN"\n' > "$RUNNER_TEMP/askpass.sh"
          chmod +x "$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          REMOTE="https://x-access-token@github.com/${GITHUB_REPOSITORY}.git"
          git push "$REMOTE" main

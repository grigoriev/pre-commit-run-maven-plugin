name: Bump Version & Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # ref: main, because a dispatch can start from any branch, while the steps
      # below commit the release version to main. Without it a dispatch from a
      # feature branch would publish that branch as main.
      #
      # persist-credentials: false, so no token lands in .git/config. PAT_TOKEN
      # reaches only the step that pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25.0.4+101.0.LTS"
          distribution: "temurin"
          cache: "maven"

      - name: Get current version
        id: current
        run: |
          RAW=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          VERSION="${RAW%-SNAPSHOT}"
          if [ "$RAW" = "$VERSION" ]; then SNAPSHOT=false; else SNAPSHOT=true; fi
          {
            echo "version=$VERSION"
            echo "snapshot=$SNAPSHOT"
          } >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Calculate new version
        id: new
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          BUMP_TYPE: ${{ inputs.bump_type }}
          SNAPSHOT: ${{ steps.current.outputs.snapshot }}
        run: |
          # The pom already holds the next development version: release.yml advanced it
          # after the previous release. A patch release therefore publishes it as it
          # stands. Incrementing here as well skips a number: it made the first release
          # of this project 0.1.1 rather than 0.1.0.
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          case "$BUMP_TYPE" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              # A pom without -SNAPSHOT holds a version that is already released: the
              # snapshot bump after that release failed. Take the next patch then.
              if [ "$SNAPSHOT" != "true" ]; then
                patch=$((patch + 1))
              fi
              ;;
          esac
          NEW_VERSION="${major}.${minor}.${patch}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Update version in pom.xml
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: |
          mvn versions:set "-DnewVersion=${NEW_VERSION}" -DgenerateBackupPoms=false
          cat pom.xml | grep -A1 '<artifactId>pre-commit-run-maven-plugin</artifactId>'

      - name: Update version in README.md
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: |
          sed -i "s/<version>[0-9]*\.[0-9]*\.[0-9]*<\/version>/<version>${NEW_VERSION}<\/version>/g" README.md || true

      # The release workflow takes its notes from the section cut here.
      - name: Move the Unreleased entries of CHANGELOG.md into the release
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: .github/scripts/changelog-cut.sh "$NEW_VERSION"

      # PAT_TOKEN, not GITHUB_TOKEN: a tag pushed with the default token starts
      # no workflow, so the release workflow would never see it.
      - name: Commit and tag
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml README.md CHANGELOG.md
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          # The token reaches git through GIT_ASKPASS, so the remote URL holds no
          # credential. A URL with the token would show in the process list and in
          # the output of a failed push. The helper reads the token from the env.
          # shellcheck disable=SC2016  # $PAT_TOKEN is read when the helper runs
          printf '#!/bin/sh\nexec echo "$PAT_TOKEN"\n' > "$RUNNER_TEMP/askpass.sh"
          chmod +x "$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          REMOTE="https://x-access-token@github.com/${GITHUB_REPOSITORY}.git"
          git push "$REMOTE" main
          git push "$REMOTE" "v${NEW_VERSION}"

      - name: Summary
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: |
          {
            echo "## Release v${NEW_VERSION}"
            echo ""
            echo "Version bumped from \`${CURRENT_VERSION}\` to \`${NEW_VERSION}\`"
            echo ""
            echo "The [release workflow](../../actions/workflows/release.yml) will now:"
            echo "- Run tests"
            echo "- Create GitHub Release"
          } >> "$GITHUB_STEP_SUMMARY"

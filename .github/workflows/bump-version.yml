name: Bump Version & Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the Commit and tag step pushes with PAT_TOKEN
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25.0.4+101.0.LTS"
          distribution: "temurin"
          cache: "maven"

      - name: Get current version
        id: current
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Calculate new version
        id: new
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          # The pom already holds the next development version: release.yml advanced it
          # after the previous release. A patch release therefore publishes it as it
          # stands. Incrementing here as well skips a number: it made the first release
          # of this project 0.1.1 rather than 0.1.0.
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          case "$BUMP_TYPE" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              ;;
          esac
          NEW_VERSION="${major}.${minor}.${patch}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Update version in pom.xml
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: |
          mvn versions:set "-DnewVersion=${NEW_VERSION}" -DgenerateBackupPoms=false
          cat pom.xml | grep -A1 '<artifactId>pre-commit-run-maven-plugin</artifactId>'

      - name: Update version in README.md
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: |
          sed -i "s/<version>[0-9]*\.[0-9]*\.[0-9]*<\/version>/<version>${NEW_VERSION}<\/version>/g" README.md || true

      - name: Commit and tag
        env:
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml README.md
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main
          git push origin "v${NEW_VERSION}"

      - name: Summary
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          NEW_VERSION: ${{ steps.new.outputs.version }}
        run: |
          {
            echo "## Release v${NEW_VERSION}"
            echo ""
            echo "Version bumped from \`${CURRENT_VERSION}\` to \`${NEW_VERSION}\`"
            echo ""
            echo "The [release workflow](../../actions/workflows/release.yml) will now:"
            echo "- Run tests"
            echo "- Create GitHub Release"
          } >> "$GITHUB_STEP_SUMMARY"
